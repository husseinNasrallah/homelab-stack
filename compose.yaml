name: homelab
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_PATH:?Set MEDIA_PATH in .env}:/media:ro

volumes:
  jellyfin-config:
  jellyfin-cache:
